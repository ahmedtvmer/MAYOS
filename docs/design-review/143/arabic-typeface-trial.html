      const screenNames = { home: 'Home', logger: 'Workout logger', chat: 'Assistant chat' };
      function render(screen) {
        const activeScreen = Object.hasOwn(captures, screen) ? screen : 'home';
        picker.value = activeScreen;
        for (const pair of ['A', 'B']) {
          const img = root.querySelector('#mayos-trial-' + pair.toLowerCase());
          img.src = captures[activeScreen][pair];
          const families = pair === 'A' ? 'Amiri headings and IBM Plex Sans Arabic body' : 'Reem Kufi headings and Cairo body';
          img.alt = screenNames[activeScreen] + ' in Arabic RTL with ' + families;
        }
      }
      picker.addEventListener('change', () => {
        render(picker.value);
        if (window.openai?.setWidgetState) {
          window.openai.setWidgetState({modelContent: {screen: picker.value}, privateContent: null}).catch(() => {});
        }
      });
      render(window.openai?.widgetState?.modelContent?.screen);
      window.addEventListener('openai:set_globals', event => {
        const saved = event.detail?.globals?.widgetState;
        if (saved?.modelContent?.screen) render(saved.modelContent.screen);
      });
    })();
