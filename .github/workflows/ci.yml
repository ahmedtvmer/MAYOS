name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Unit, Concurrency & Telemetry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 sqlite3

      - name: Cache Embedding Model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: mayos-embeddings-${{ runner.os }}-bge-small-en-v1.5
          restore-keys: |
            mayos-embeddings-${{ runner.os }}-

      - name: Install CPU PyTorch for Local Embeddings
        run: uv pip install --system --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest ruff

      - name: Verify Player Model Gate Hermetically
        run: python tests/eval/run_evaluation.py --hermetic --report /tmp/player-gate-ci.json

      - name: Upload player gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-gate-report
          path: /tmp/player-gate-ci.json
          if-no-files-found: ignore

      - name: Lint with Ruff
        run: |
          ruff check --select E,F,W --ignore E402,E501,EXE002,W291,W292,W293 .

      - name: Download Embedding Models
        run: python -c "from core.embeddings import download_model_files, download_arabic_model_files; download_model_files(); download_arabic_model_files()"

      - name: Run Schema Initialization & Vector Seeding
        env:
          SEED_CSV_PATH: "tests/fixtures/mock_exercises.csv"
          SEED_CURATION_PATH: "tests/fixtures/mock_exercise_curation.csv"
          SEED_FOOD_CSV_PATH: "tests/fixtures/smoke_food_library.csv"
          SEED_FOOD_PORTIONS_CSV_PATH: "tests/fixtures/smoke_food_portions.csv"
          MODEL_DEVICE: "cpu"
          EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
        run: |
          python scripts/intialize_db.py
          sqlite3 db/catalog.db "PRAGMA index_list('exercise_secondary_muscles');" | grep -q "idx_secondary_muscles_ex"
          python scripts/seed_vectors.py
          
      - name: Run Unit & Telemetry Tests
        env:
          SKIP_LLM_LOAD: "true"
        run: |
          mkdir -p logs db/users
          pytest tests/ -v

      - name: Verify Engine Health Parser
        run: |
          python scripts/check_engine_health.py

      - name: Run WAL Concurrency Stress Test
        env:
          SEED_CURATION_PATH: "tests/fixtures/mock_exercise_curation.csv"
        run: |
          python tests/benchmark_wal_concurrency.py

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mayos-engine:latest
          build-args: GIT_COMMIT=${{ github.sha }}

  image-smoke:
    name: Production Image Smoke Test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'pull_request'
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Image
        run: |
          set -euo pipefail
          mkdir -p data
          cp tests/fixtures/smoke_exercises.csv data/processed_exercises.csv
          cp tests/fixtures/smoke_exercise_curation.csv data/exercise_curation.csv
          cp tests/fixtures/smoke_food_library.csv data/food_library.csv
          cp tests/fixtures/smoke_food_portions.csv data/food_portions.csv
          docker build --file Dockerfile.fly --tag mayos-engine:smoke .

      - name: Boot image and run API scenario
        env:
          JWT_SECRET: ci-smoke-only-secret-not-for-production
        run: |
          set -euo pipefail
          container_id=""
          data_volume="mayos-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            docker volume rm "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$data_volume" >/dev/null
          docker run --rm --network none \
            --volume "$data_volume:/data" \
            --env MAYOS_DATA_DIR=/data \
            mayos-engine:smoke python scripts/intialize_db.py --seed-only

          container_id=$(docker run --detach --rm \
            --publish 127.0.0.1:8000:8000 \
            --volume "$data_volume:/data" \
            --env JWT_SECRET="$JWT_SECRET" \
            --env TESTING=1 \
            --env MAYOS_DATA_DIR=/data \
            --env LLM_API_KEY= \
            --env POSTHOG_API_KEY= \
            mayos-engine:smoke python -m scripts.ci_image_server)

          python scripts/ci_image_smoke.py --base-url http://127.0.0.1:8000 --timeout 300
