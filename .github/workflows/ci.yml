name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit, Concurrency & Telemetry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 sqlite3

      - name: Install Dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Schema Initialization & Index Verification
        run: |
          python scripts/intialize_db.py
          sqlite3 db/catalog.db "PRAGMA index_list('exercise_secondary_muscles');" | grep -q "idx_secondary_muscles_ex"

      - name: Run Unit & Telemetry Tests
        env:
          SKIP_LLM_LOAD: "true"
        run: |
          mkdir -p logs db/users
          pytest tests/ -v

      - name: Verify Engine Health Parser
        run: |
          python scripts/check_engine_health.py

      - name: Run WAL Concurrency Stress Test
        run: |
          python tests/benchmark_wal_concurrency.py

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: myos-engine:latest