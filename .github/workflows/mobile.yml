name: Mobile Tests

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile changes
        id: mobile-changes
        shell: bash
        # Pathspecs are relative to the working directory; run from the repo root.
        working-directory: .
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$base...HEAD" -- mobile/ .github/workflows/mobile.yml | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.mobile-changes.outputs.changed == 'true'
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        if: steps.mobile-changes.outputs.changed == 'true'
        run: flutter --version

      - name: Get Flutter dependencies
        if: steps.mobile-changes.outputs.changed == 'true'
        run: flutter pub get

      - name: Show lockfile changes
        if: always() && steps.mobile-changes.outputs.changed == 'true'
        run: git diff --stat -- pubspec.lock

      - name: Upload resolved lockfile
        if: always() && steps.mobile-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: warn

      - name: Run Flutter tests
        if: steps.mobile-changes.outputs.changed == 'true'
        run: flutter test
