services:
  mayos-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: mayos_api
    restart: unless-stopped
    # SQLite has a single writer, and the API uses a bounded hosted model client.
    stop_grace_period: 60s
    command: ["uvicorn", "svc.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      - LLM_API_KEY=${LLM_API_KEY:?set LLM_API_KEY in environment}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - JUDGE_MODEL=${JUDGE_MODEL:-Qwen/Qwen3.5-27B}
      - COACH_MODEL=${COACH_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-1}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - ARABIC_EMBEDDING_MODEL=intfloat/multilingual-e5-small
      - MODEL_DEVICE=cpu
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in environment}
      - ANONYMOUS_ID_SECRET=${ANONYMOUS_ID_SECRET:-${JWT_SECRET}}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-${MAYOS_ENV:-production}}
      - SENTRY_READ_TOKEN=${SENTRY_READ_TOKEN:-}
      - DISCORD_ALERT_WEBHOOK_URL=${DISCORD_ALERT_WEBHOOK_URL:-}
      - SENTRY_ORG=${SENTRY_ORG:-mayos}
      - SENTRY_PROJECTS=${SENTRY_PROJECTS:-mayos-api,mayos-app}
      - SENTRY_API_BASE_URL=${SENTRY_API_BASE_URL:-https://de.sentry.io}
      - UPTIMEROBOT_READ_KEY=${UPTIMEROBOT_READ_KEY:-}
      - POSTHOG_PROJECT_URL=${POSTHOG_PROJECT_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mayos_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://mayos-api:8000
    depends_on:
      - mayos-api
