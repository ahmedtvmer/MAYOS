services:
  myos-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myos_engine
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./database:/app/database
    environment:
      - MODEL_PATH=/app/models/qwen2.5-3b-instruct-q4_k_m.gguf
      - OMP_NUM_THREADS=6
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - LLM=qwen2.5:3b