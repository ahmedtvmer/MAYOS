services:
  myos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myos_api
    restart: unless-stopped
    # SQLite has a single writer, and the API uses a bounded hosted model client.
    stop_grace_period: 60s
    command: ["uvicorn", "svc.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepinfra.com/v1/openai}
      - LLM_API_KEY=${LLM_API_KEY:?set LLM_API_KEY in environment}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - JUDGE_MODEL=${JUDGE_MODEL:-Qwen/Qwen3.5-27B}
      - COACH_MODEL=${COACH_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-1}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - MODEL_DEVICE=cpu
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in environment}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: myos_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://myos-api:8000
    depends_on:
      - myos-api
