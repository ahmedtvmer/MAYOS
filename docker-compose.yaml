services:
  myos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myos_api
    restart: unless-stopped
    # Single replica: local GGUF + SQLite cannot scale horizontally.
    stop_grace_period: 60s
    command: ["uvicorn", "svc.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=/app/models/Qwen3.5-4B-Q4_K_M.gguf
      - JUDGE_MODEL_PATH=/app/models/Qwen3.5-9B-Q4_K_M.gguf
      - MODEL_DIR=/app/models
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - N_GPU_LAYERS=16
      - MODEL_DEVICE=cuda
      - EMBEDDING_DEVICE=cuda
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in environment}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  myos-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myos_engine
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    environment:
      - API_BASE_URL=http://myos-api:8000
    depends_on:
      myos-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: myos_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://myos-engine:8501
    depends_on:
      - myos-engine
