# Fly.io closed-trial topology: one always-on API writer with a durable volume.
#
# This app deploys the FastAPI service only. Streamlit is legacy and is not a
# product service (retirement: #46). There is intentionally NO [deploy]
# release_command: the release Machine cannot mount the volume, so catalog
# initialization and vector seeding run once inside the API Machine (see
# docs/DEPLOYMENT.md). Daily backups (#41) run inside this same always-on
# Machine, never on a detached Machine that cannot mount /data
# (MAYOS_DAILY_BACKUP_INTERVAL_SECONDS, default 3600; 0 disables; at most one
# snapshot per UTC day); use scripts/backup_now.py to force one and
# scripts/restore_backup.py --on-next-boot to restore.
# The missed-day alert sweep (#31) runs in-process in this Machine once at
# startup and hourly (MAYOS_ALERT_SWEEP_INTERVAL_SECONDS, default 3600; 0
# disables); use scripts/run_alert_sweep.py to force an immediate pass. The
# model spend alert (#39, ADR 038) rides that same sweep and is deduped once per
# UTC month; the owner address comes from the OWNER_ALERT_EMAIL secret and usage
# is reviewed with scripts/model_usage_report.py.

app = "mayos-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  # Catalog, ledgers, and the migration/backup work area all derive from /data.
  MAYOS_DATA_DIR = "/data"
  # Fail closed at boot/readiness when the volume is not a writable mount.
  MAYOS_REQUIRE_PERSISTENT_DATA = "true"
  # Hosted inference: no GGUF/CUDA/llama-cpp in the image.
  LLM_BACKEND = "openai"
  MODEL_DEVICE = "cpu"
  EMBEDDING_DEVICE = "cpu"
  HF_HOME = "/app/.cache/huggingface"
  # Password-reset / App Link base: this app's public host. It must be identical
  # in RESET_LINK_BASE_URL, the Android App Link intent-filter host
  # (-PappLinkHost, default mayos-api.fly.dev) and where
  # /.well-known/assetlinks.json is served. Read by service/email_sender.py.
  RESET_LINK_BASE_URL = "https://mayos-api.fly.dev"
  # CORS origin for the (legacy) web client; not used for reset links.
  # UI_BASE_URL = "https://<web-app-host>"
  # Hosted-model usage controls (#39, ADR 038). Limits are per immutable account,
  # enforced before any model call or stream starts. The spend alert is deduped
  # once per UTC month; OWNER_ALERT_EMAIL is a `fly secrets set` value, not [env].
  # MODEL_RATE_LIMIT_REQUESTS = "20"      # requests/minute/account (0 disables)
  # MODEL_DAILY_TOKEN_LIMIT = "200000"    # tokens/UTC day/account (0 disables)
  # MODEL_SPEND_ALERT_USD = "50"
  # MODEL_PRICING_JSON = '{"Qwen/Qwen3.5-9B":{"input":0.10,"output":0.30},"Qwen/Qwen3.5-27B":{"input":0.30,"output":0.90}}'
  # Android App Link association. Set the signing-cert SHA-256 fingerprint(s)
  # (comma-separated; case/colons optional, normalised to uppercase
  # colon-separated). Include both the upload key and the Play App Signing cert
  # when distributing via Play. No valid fingerprint => the endpoint 404s.
  # ANDROID_APP_PACKAGE = "com.mayos.mayos_mobile"
  # ANDROID_APP_SHA256_CERT_FINGERPRINTS = "AA:BB:CC:..."

[http_service]
  internal_port = 8000
  force_https = true
  # Always-on single writer: never autostop, and do not autostart from zero.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[mounts]]
  source = "mayos_data"
  destination = "/data"
  initial_size = "10gb"
  # ADR 015: default Fly volume snapshots are disabled; backups belong to #41.
  scheduled_snapshots = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  cpus = 1
  cpu_kind = "shared"

# Keep the single API writer running if its process exits unexpectedly.
[[restart]]
  policy = "always"
