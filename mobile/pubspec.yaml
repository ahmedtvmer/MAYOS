name: mayos_mobile
description: MAYOS player client (Android closed trial).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path URL strategy for clean browser URLs (#127); a no-op on Android.
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.5.1
  intl: any
  # Lightweight GFM rendering for selectable assistant replies.
  flutter_markdown_plus:
    path: packages/flutter_markdown_plus
  flutter_timezone: ^5.1.0
  go_router: ^14.2.0
  play_install_referrer: ^0.5.0
  posthog_flutter: ^5.50.13
  # Privacy policy (issue #43): the API serves the policy at /privacy and the
  # app opens it in the system browser rather than embedding a WebView or
  # rendering its own copy of the text.
  url_launcher: ^6.3.0
  # The workout logger keeps the screen awake while it is open (#123/#107).
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Launcher icon generation (#150). Re-run after changing the logo:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# Launcher icon generation (#150). Source art lives in the repo root under
# assets/; the copies below are the ones this tool reads (paths must stay
# inside the Flutter project). iOS/web/splash are intentionally not configured.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/mayos-android-logo.png"
  # Sampled from the tile in the source PNG (median of the opaque pixels in
  # its bottom third): the navy the adaptive layer sits on.
  adaptive_icon_background: "#01183D"
  # Safe-zone padding (66dp of the 108dp canvas) is baked into the foreground
  # PNG, so the XML layer must not be inset on top of it.
  adaptive_icon_foreground: "assets/mayos-android-logo-foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/

  fonts:
    # MAYOS typography pair (OFL). See mobile/DESIGN.md for provenance and how
    # to swap the approximation. Variable fonts: weights are selected through
    # MayosTypography, which sets explicit `fontVariations`.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    # Static faces used for every typography role in the Arabic version.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
