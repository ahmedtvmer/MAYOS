name: mayos_mobile
description: MAYOS player client (Android closed trial).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.5.1
  flutter_timezone: ^5.1.0
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/

  fonts:
    # MAYOS typography pair (OFL). See mobile/DESIGN.md for provenance and how
    # to swap the approximation. Variable fonts: weights are selected through
    # MayosTypography, which sets explicit `fontVariations`.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
