<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MYOS training and coaching.">
  <meta name="theme-color" content="#0A1422">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MYOS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <script src="safe_area.js"></script>

  <title>MYOS</title>
  <style>
    /* Pre-Flutter fallback mirrors MyosPalette.darkCanvas. */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0A1422;
    }

    #myos-loading {
      position: fixed;
      z-index: 1;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      /* Mirrors MyosPalette.darkCanvas. */
      background: #0A1422;
      opacity: 1;
      transition: opacity 320ms ease-out;
    }

    #myos-loading::before {
      position: absolute;
      inset: -12px;
      content: "";
      background: url("myos-loading-wallpaper.jpg") center / cover no-repeat;
      /* Mirrors MyosWallpaper.blurSigma. */
      filter: blur(6px);
      transform: scale(1.02);
    }

    #myos-loading::after {
      position: absolute;
      inset: 0;
      content: "";
      /* Mirrors MyosWallpaper.overlayOpacity. */
      background: rgb(0 0 0 / 60%);
    }

    #myos-loading img {
      position: relative;
      z-index: 1;
      display: block;
      width: auto;
      /* Mirrors SplashScreen: min(0.42 × width, 0.22 × height), 72–120dp. */
      height: clamp(72px, min(42vw, 22vh), 120px);
    }

    #myos-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="myos-loading" aria-hidden="true">
    <img src="myos-lockup-white.png" alt="">
  </div>
  <script src="posthog_init.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
