services:
  api:
    image: "mayos-api:${MAYOS_IMAGE_TAG:?set MAYOS_IMAGE_TAG in deploy/.image.env}"
    build:
      context: ..
      dockerfile: Dockerfile.fly
      args:
        GIT_COMMIT: "${MAYOS_IMAGE_TAG:?set MAYOS_IMAGE_TAG in deploy/.image.env}"
    env_file:
      - /opt/mayos/.env
    environment:
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in /opt/mayos/.env}"
      ANONYMOUS_ID_SECRET: "${ANONYMOUS_ID_SECRET:-${JWT_SECRET}}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-${MAYOS_ENV:-production}}"
      SENTRY_READ_TOKEN: "${SENTRY_READ_TOKEN:-}"
      DISCORD_ALERT_WEBHOOK_URL: "${DISCORD_ALERT_WEBHOOK_URL:-}"
      SENTRY_ORG: "${SENTRY_ORG:-mayos}"
      SENTRY_PROJECTS: "${SENTRY_PROJECTS:-mayos-api,mayos-app}"
      SENTRY_API_BASE_URL: "${SENTRY_API_BASE_URL:-https://de.sentry.io}"
      UPTIMEROBOT_READ_KEY: "${UPTIMEROBOT_READ_KEY:-}"
      POSTHOG_PROJECT_URL: "${POSTHOG_PROJECT_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:?set LLM_API_KEY in /opt/mayos/.env}"
      MAYOS_DATA_DIR: /data
      MAYOS_REQUIRE_PERSISTENT_DATA: "true"
      MAYOS_CLIENT_IP_HEADER: cf-connecting-ip
      MAYOS_LITESTREAM: "true"
      RESET_LINK_BASE_URL: "https://${MAYOS_API_HOSTNAME:?set MAYOS_API_HOSTNAME in /opt/mayos/.env}"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /mnt/mayos-data/data
        target: /data
        bind:
          create_host_path: false
    command:
      - uvicorn
      - svc.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in /opt/mayos/.env}"
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.18
    environment:
      R2_ENDPOINT: "${R2_ENDPOINT:?set R2_ENDPOINT in /opt/mayos/.env}"
      R2_BUCKET: "${R2_BUCKET:?set R2_BUCKET in /opt/mayos/.env}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in /opt/mayos/.env}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in /opt/mayos/.env}"
      LITESTREAM_R2_PREFIX: "${LITESTREAM_R2_PREFIX:?set LITESTREAM_R2_PREFIX in /opt/mayos/.env}"
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - type: bind
        source: /mnt/mayos-data/data
        target: /data
        bind:
          create_host_path: false
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
