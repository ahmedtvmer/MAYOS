# Litestream v0.5.18; set LITESTREAM_R2_PREFIX in Compose (litestream in production).
# Until paying users, keep R2 replication and periodic remote work hourly or slower.

# L1 compaction runs daily. Snapshot creation and retention enforcement are daily.
levels:
  - interval: 24h
snapshot:
  interval: 24h
  retention: 24h
l0-retention: 5m
l0-retention-check-interval: 24h
retention:
  enabled: true

# Local WAL monitoring and checkpointing stay frequent; they do not change the R2 sync cadence.
dbs:
  - path: /data/catalog.db
    monitor-interval: 1s
    checkpoint-interval: 1m
    min-checkpoint-page-count: 1000
    truncate-page-n: 121359
    replica:
      type: s3
      sync-interval: 1h
      bucket: ${R2_BUCKET}
      path: ${LITESTREAM_R2_PREFIX}/catalog.db
      endpoint: ${R2_ENDPOINT}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}

  - path: /data/deletions.db
    monitor-interval: 1s
    checkpoint-interval: 1m
    min-checkpoint-page-count: 1000
    truncate-page-n: 121359
    replica:
      type: s3
      sync-interval: 1h
      bucket: ${R2_BUCKET}
      path: ${LITESTREAM_R2_PREFIX}/deletions.db
      endpoint: ${R2_ENDPOINT}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}

  - dir: /data/users
    pattern: "*.db"
    watch: true
    monitor-interval: 10s
    checkpoint-interval: 1m
    min-checkpoint-page-count: 1000
    truncate-page-n: 121359
    replica:
      type: s3
      sync-interval: 1h
      bucket: ${R2_BUCKET}
      path: ${LITESTREAM_R2_PREFIX}/users
      endpoint: ${R2_ENDPOINT}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
