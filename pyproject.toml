[project]
name = "mayos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmedtvmer", email = "ahmedhegazy4me@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.1",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
mayos = "mayos:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
