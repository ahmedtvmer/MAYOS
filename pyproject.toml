[project]
name = "mayos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahmedtvmer", email = "ahmedhegazy4me@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sqlite-vec>=0.1.9",
    "streamlit>=1.63.0",
]

[project.scripts]
mayos = "mayos:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = [
    "EXE002",  # Executable file missing shebang
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",    # Module level import not at top of file
    "E501",    # Line length
    "EXE002",  # Missing executable shebang
    "UP006",   # Deprecated collections type hints
    "UP035",   # Deprecated typing imports
    "I001",    # Unsorted import blocks
    "W291",    # Trailing whitespace
    "W293",    # Blank line contains whitespace
]